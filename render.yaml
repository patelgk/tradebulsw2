services:
  # Backend API - shared by both frontends
  - type: web
    name: proprupee-backend
    env: node
    plan: starter
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_MARKET_SIMULATOR
        value: false
      - key: TEST_MODE
        value: false
      - key: DISABLE_DHAN_WS
        value: false
      - key: DISABLE_DHAN_AUTOFETCH
        value: false
      - key: MONGODB_URI
        sync: false
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_ACCESS_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGINS
        value: "proprupee.com,admin.proprupee.com"

  # User Frontend - proprupee.com
  - type: web
    name: proprupee-frontend-user
    env: node
    plan: starter
    rootDir: frontend/user
    buildCommand: npm ci && npm run build
    startCommand: npm run preview
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_BACKEND_URL
        value: "https://proprupee-backend.onrender.com"
      - key: VITE_PUBLIC_URL
        value: "https://proprupee.com"

  # Admin Frontend - admin.proprupee.com
  - type: web
    name: proprupee-frontend-admin
    env: node
    plan: starter
    rootDir: frontend/admin
    buildCommand: npm ci && npm run build
    startCommand: npm run preview
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_BACKEND_URL
        value: "https://proprupee-backend.onrender.com"
      - key: VITE_PUBLIC_URL
        value: "https://admin.proprupee.com"
      - key: VITE_ADMIN_MODE
        value: "true"
